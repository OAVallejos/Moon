[package]
name = "astro_tfc"
version = "0.1.0"
edition = "2021"
authors = ["Omar Ariel Vallejos <arielvallejosok@gmail.com>"]
description = "Simulación de transferencia Tierra-Luna vía L1 usando TFC para carga vital"

[lib]
name = "astro_tfc"
crate-type = ["cdylib", "rlib"]

[dependencies]
# --- Interoperabilidad con Python ---
pyo3 = { version = "0.20", features = ["extension-module"] }

# --- Álgebra Lineal y Estructuras ---
ndarray = "0.15"
nalgebra = "0.32"
num-complex = "0.4"
num-traits = "0.2"

# --- Integración Numérica de EDOs ---
diffsol = "0.6"

# --- Optimización para TFC ---
argmin = "0.9"

# --- Polinomios de Chebyshev ---
polynomial = "0.2"

# --- Serialización ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# --- Rendimiento y Paralelismo (AHORA OPCIONAL) ---
rayon = { version = "1.11", optional = true }          # ← ¡CORREGIDO!
num_cpus = "1.16"

# --- Utilidades ---
itertools = "0.10"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
chrono = "0.4"

# --- Estadística y Validación ---
statrs = "0.16"
approx = "0.5"

[build-dependencies]
pyo3-build-config = "0.20"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
rpath = true
debug = false

[profile.dev]
opt-level = 1
debug = true

# ⚠️ CARACTERÍSTICAS - CORREGIDO
[features]
default = ["pyo3", "parallel"]   # ← Activamos parallel por defecto
pyo3 = []
parallel = ["rayon"]             # ← Ahora funciona porque rayon es opcional